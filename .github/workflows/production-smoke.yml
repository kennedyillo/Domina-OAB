name: Production Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/production-smoke.mjs"
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run external production smoke
        env:
          SMOKE_BASE_URL: https://www.dominaoab.com.br
          SMOKE_RATE_LIMIT: "1"
        run: node scripts/production-smoke.mjs
